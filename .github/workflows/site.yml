# Generated by `opsci publish push`; edits are overwritten at the next publish.
# Builds the project site from this repository and deploys it to GitHub Pages
# (Settings -> Pages -> Source: GitHub Actions).
name: site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "opsci @ git+https://github.com/mhycheung/open-science.git@814244c39a1b765b82939d3b77e3ab66c7296e65#subdirectory=tools" mkdocs==1.6.1 mkdocs-material==9.7.7
      - run: opsci site build . --out _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
